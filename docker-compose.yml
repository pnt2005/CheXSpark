name: chexspark

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-chexspark}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-chexspark123}

x-minio-creds: &minio-creds
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-chexspark}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-chexspark123}
  MLFLOW_S3_ENDPOINT_URL: http://minio:9000
  AWS_S3_ENDPOINT: http://minio:9000
  AWS_PATH_STYLE_ACCESS: "true"

# ─────────────────────────── Airflow (orchestration) ───────────────────────────
x-airflow-env: &airflow-env
  <<: *minio-creds
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-chexspark123}@postgres:5432/airflow
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
  # Cluster dev 8GB: 2 slot = 1 task điều phối (TriggerDagRunOperator đang chờ)
  # + 1 task Spark thật. Để 1 sẽ DEADLOCK: task chờ chiếm hết slot nên DAG con
  # không bao giờ được schedule.
  AIRFLOW__CORE__PARALLELISM: "2"
  AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
  AIRFLOW__CORE__DAG_CONCURRENCY: "1"
  AIRFLOW__WEBSERVER__WORKERS: "1"
  AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "30"
  # SparkSubmitOperator lấy --master từ connection này (provider 4.8.x)
  AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type":"spark","host":"spark://spark-master:7077"}'
  MLFLOW_TRACKING_URI: http://mlflow:5000
  SPARK_MASTER_URL: spark://spark-master:7077
  # Kaggle CLI trong DAG retrain (train_on_kaggle.py nạp .env nếu có, ở container
  # không có .env nên lấy từ env này — cùng giá trị với .env trên host)
  KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
  KAGGLE_KEY: ${KAGGLE_KEY:-}

x-airflow-volumes: &airflow-volumes
  - ./dags:/opt/airflow/dags
  - ./src:/opt/airflow/src:ro          # Spark job scripts (nộp qua spark-submit)
  - ./infra/spark/jars:/opt/airflow/jars:ro   # S3A jars cho driver
  # Cho DAG chexspark_retrain_112k: script export/Kaggle + chỗ ghi dataset & output
  - ./scripts:/opt/airflow/scripts:ro
  - ./data:/opt/airflow/data           # dataset Kaggle (labels/mask pack) + output train
  - ./notebooks:/opt/airflow/notebooks # --install copy checkpoint/metrics vào đây
  - airflow-logs:/opt/airflow/logs


services:
  # ─────────────────────────── MinIO (S3-compatible object storage) ───────────────────────────
  minio:
    image: bitnamilegacy/minio:latest
    container_name: chexspark-minio
    # Bitnami run.sh tự chạy: minio server --console-address :9001 --address :9000 /bitnami/minio/data
    environment:
      <<: *minio-env
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
      MINIO_DATA_DIR: /bitnami/minio/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"   # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Web console
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [chexspark-net]
    restart: unless-stopped

  # Tạo bucket "mlflow" (artifact store) sau khi MinIO sẵn sàng
  minio-init:
    image: bitnamilegacy/minio-client:latest
    container_name: chexspark-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      <<: *minio-env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/mlflow &&
      mc anonymous set download local/mlflow ||
      true"
    networks: [chexspark-net]
    restart: "no"

  # ─────────────────────────── PostgreSQL (MLflow metadata catalog) ───────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: chexspark-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chexspark123}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [chexspark-net]
    restart: unless-stopped

  # ─────────────────────────── Spark Master ───────────────────────────
  spark-master:
    build: ./infra/spark
    image: chexspark-spark:3.5.1
    container_name: chexspark-spark-master
    hostname: spark-master
    user: root
    command: >
      /opt/spark/sbin/../bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080
    environment:
      <<: *minio-creds
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "${SPARK_MASTER_PORT:-7077}:7077"   # spark:// URL
      - "${SPARK_MASTER_UI_PORT:-8080}:8080" # Master UI
    volumes:
      - ./infra/spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./src:/opt/spark/user-src:ro        # expose code cho Spark jobs (upload / python path)
      - spark-warehouse:/opt/spark/user-warehouse
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      chexspark-net:
        aliases:
          - spark-master
    restart: unless-stopped

  # ─────────────────────────── Spark Worker 1 ───────────────────────────
  spark-worker-1:
    build: ./infra/spark
    image: chexspark-spark:3.5.1
    container_name: chexspark-spark-worker-1
    hostname: spark-worker-1
    user: root
    command: >
      /opt/spark/sbin/../bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --webui-port 8081
      --cores ${SPARK_WORKER_CORES:-2}
      --memory ${SPARK_WORKER_MEMORY:-4G}
    environment:
      <<: *minio-creds
      SPARK_NO_DAEMONIZE: "true"
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "${SPARK_WORKER1_UI_PORT:-8081}:8081"
    volumes:
      - ./infra/spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./src:/opt/spark/user-src:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8081'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      chexspark-net:
        aliases:
          - spark-worker-1
    restart: unless-stopped

  # ─────────────────────────── Spark Worker 2 ───────────────────────────
  spark-worker-2:
    build: ./infra/spark
    image: chexspark-spark:3.5.1
    container_name: chexspark-spark-worker-2
    hostname: spark-worker-2
    user: root
    command: >
      /opt/spark/sbin/../bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --webui-port 8082
      --cores ${SPARK_WORKER_CORES:-2}
      --memory ${SPARK_WORKER_MEMORY:-4G}
    environment:
      <<: *minio-creds
      SPARK_NO_DAEMONIZE: "true"
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "${SPARK_WORKER2_UI_PORT:-8082}:8082"
    volumes:
      - ./infra/spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./src:/opt/spark/user-src:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8082'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      chexspark-net:
        aliases:
          - spark-worker-2
    restart: unless-stopped

  # ─────────────────────────── MLflow Tracking Server ───────────────────────────
  mlflow:
    build: ./infra/mlflow          # + psycopg2 (Postgres) + boto3 (MinIO)
    image: chexspark-mlflow:2.9.2
    container_name: chexspark-mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *minio-creds
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-chexspark123}@postgres:5432/mlflow
      MLFLOW_ARTIFACT_ROOT: s3://mlflow
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    # entrypoint sh -c: cần shell để expand $MLFLOW_* (Docker không expand biến
    # trong CMD). Trước đây thiếu shell nên --default-artifact-root nhận đúng
    # chuỗi "$MLFLOW_ARTIFACT_ROOT" → mọi artifact ghi vào /MLFLOW_ARTIFACT_ROOT
    # trong container (mất khi recreate) thay vì MinIO.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        exec mlflow server --host 0.0.0.0 --port 5000
        --backend-store-uri "$$MLFLOW_BACKEND_STORE_URI"
        --artifacts-destination "$$MLFLOW_ARTIFACT_ROOT"
        --default-artifact-root "mlflow-artifacts:/"
        --serve-artifacts
    networks: [chexspark-net]
    restart: unless-stopped

  # ─────────────────────────── Apache Airflow — init (DB migrate + admin user) ───────────────────────────
  airflow-init:
    build: ./infra/airflow
    image: chexspark-airflow:2.9.3
    container_name: chexspark-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *airflow-env
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create --username admin --password admin \
          --firstname Admin --lastname CheXSpark --role Admin \
          --email admin@chexspark.local || true
        echo "Airflow DB ready"
    networks: [chexspark-net]
    restart: "no"

  # ─────────────────────────── Apache Airflow — webserver (UI) ───────────────────────────
  airflow-webserver:
    image: chexspark-airflow:2.9.3
    container_name: chexspark-airflow-webserver
    hostname: airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8085}:8080"
    volumes: *airflow-volumes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [chexspark-net]
    restart: unless-stopped

  # ─────────────────────────── Apache Airflow — scheduler (chạy task + Spark driver) ───────────────────────────
  airflow-scheduler:
    image: chexspark-airflow:2.9.3
    container_name: chexspark-airflow-scheduler
    hostname: airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
    command: scheduler
    volumes: *airflow-volumes
    networks:
      chexspark-net:
        aliases:
          - airflow-scheduler
    restart: unless-stopped

  # ─────────────────────────── Serving (FastAPI + Streamlit) ────────────────────────
  # Image chung cho 2 service: inference 3 giai đoạn (U-Net → DenseNet121 → Grad-CAM),
  # model đọc từ MLflow registry theo alias, fallback .pth trong notebooks/kaggle.
  fastapi-app:
    build:
      context: .
      dockerfile: infra/serving/Dockerfile
    image: chexspark-serving:1.0
    container_name: chexspark-fastapi
    depends_on:
      minio:
        condition: service_healthy
      mlflow:
        condition: service_started
    environment:
      <<: *minio-creds
      MLFLOW_TRACKING_URI: http://mlflow:5000
      GOLD_S3_ENDPOINT: http://minio:9000
      # gold_store KHÔNG đọc AWS_* (máy dev có AWS key thật) → truyền riêng
      GOLD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-chexspark}
      GOLD_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-chexspark123}
      SERVING_DEVICE: cpu
      # SERVING_USE_REGISTRY=0 → bỏ qua MLflow, load thẳng .pth (chạy offline)
      SERVING_USE_REGISTRY: ${SERVING_USE_REGISTRY:-1}
    command: uvicorn serving.api:app --host 0.0.0.0 --port 8000
    ports:
      - "${SERVING_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src:ro              # chỉnh code không cần rebuild image
      - ./notebooks:/app/notebooks:ro  # checkpoint fallback khi MLflow chưa chạy
    healthcheck:
      # urllib (có sẵn) thay curl — image slim không kèm curl
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://localhost:8000/api/v1/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks: [chexspark-net]
    restart: unless-stopped

  streamlit-app:
    build:
      context: .
      dockerfile: infra/serving/Dockerfile
    image: chexspark-serving:1.0
    container_name: chexspark-streamlit
    depends_on:
      fastapi-app:
        condition: service_healthy
    environment:
      API_BASE: http://fastapi-app:8000
    command: >
      streamlit run src/serving/streamlit_app.py
      --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    volumes:
      - ./src:/app/src:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://localhost:8501/_stcore/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [chexspark-net]
    restart: unless-stopped

networks:
  chexspark-net:
    driver: bridge

volumes:
  minio-data:
  postgres-data:
  spark-warehouse:
  airflow-logs:
