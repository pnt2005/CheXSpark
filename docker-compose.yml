name: chexspark

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:-chexspark}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-chexspark123}

x-minio-creds: &minio-creds
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-chexspark}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-chexspark123}
  MLFLOW_S3_ENDPOINT_URL: http://minio:9000
  AWS_S3_ENDPOINT: http://minio:9000
  AWS_PATH_STYLE_ACCESS: "true"

services:
  # ─────────────────────────── MinIO (S3-compatible object storage) ───────────────────────────
  minio:
    image: bitnamilegacy/minio:latest
    container_name: chexspark-minio
    # Bitnami run.sh tự chạy: minio server --console-address :9001 --address :9000 /bitnami/minio/data
    environment:
      <<: *minio-env
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
      MINIO_DATA_DIR: /bitnami/minio/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"   # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Web console
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [chexspark-net]
    restart: unless-stopped

  # Tạo bucket "mlflow" (artifact store) sau khi MinIO sẵn sàng
  minio-init:
    image: bitnamilegacy/minio-client:latest
    container_name: chexspark-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      <<: *minio-env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/mlflow &&
      mc anonymous set download local/mlflow ||
      true"
    networks: [chexspark-net]
    restart: "no"

  # ─────────────────────────── PostgreSQL (MLflow metadata catalog) ───────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: chexspark-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chexspark123}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [chexspark-net]
    restart: unless-stopped

  # ─────────────────────────── Spark Master ───────────────────────────
  spark-master:
    build: ./infra/spark
    image: chexspark-spark:3.5.1
    container_name: chexspark-spark-master
    hostname: spark-master
    user: root
    command: >
      /opt/spark/sbin/../bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080
    environment:
      <<: *minio-creds
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "${SPARK_MASTER_PORT:-7077}:7077"   # spark:// URL
      - "${SPARK_MASTER_UI_PORT:-8080}:8080" # Master UI
    volumes:
      - ./infra/spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./src:/opt/spark/user-src:ro        # expose code cho Spark jobs (upload / python path)
      - spark-warehouse:/opt/spark/user-warehouse
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      chexspark-net:
        aliases:
          - spark-master
    restart: unless-stopped

  # ─────────────────────────── Spark Worker 1 ───────────────────────────
  spark-worker-1:
    build: ./infra/spark
    image: chexspark-spark:3.5.1
    container_name: chexspark-spark-worker-1
    hostname: spark-worker-1
    user: root
    command: >
      /opt/spark/sbin/../bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --webui-port 8081
      --cores ${SPARK_WORKER_CORES:-2}
      --memory ${SPARK_WORKER_MEMORY:-4G}
    environment:
      <<: *minio-creds
      SPARK_NO_DAEMONIZE: "true"
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "${SPARK_WORKER1_UI_PORT:-8081}:8081"
    volumes:
      - ./infra/spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./src:/opt/spark/user-src:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8081'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      chexspark-net:
        aliases:
          - spark-worker-1
    restart: unless-stopped

  # ─────────────────────────── Spark Worker 2 ───────────────────────────
  spark-worker-2:
    build: ./infra/spark
    image: chexspark-spark:3.5.1
    container_name: chexspark-spark-worker-2
    hostname: spark-worker-2
    user: root
    command: >
      /opt/spark/sbin/../bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
      --webui-port 8082
      --cores ${SPARK_WORKER_CORES:-2}
      --memory ${SPARK_WORKER_MEMORY:-4G}
    environment:
      <<: *minio-creds
      SPARK_NO_DAEMONIZE: "true"
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "${SPARK_WORKER2_UI_PORT:-8082}:8082"
    volumes:
      - ./infra/spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ./src:/opt/spark/user-src:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8082'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      chexspark-net:
        aliases:
          - spark-worker-2
    restart: unless-stopped

  # ─────────────────────────── MLflow Tracking Server ───────────────────────────
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: chexspark-mlflow
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *minio-creds
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-chexspark123}@postgres:5432/mlflow
      MLFLOW_ARTIFACT_ROOT: s3://mlflow
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri "$$MLFLOW_BACKEND_STORE_URI"
      --default-artifact-root "$$MLFLOW_ARTIFACT_ROOT"
      --serve-artifacts
    networks: [chexspark-net]
    restart: unless-stopped

networks:
  chexspark-net:
    driver: bridge

volumes:
  minio-data:
  postgres-data:
  spark-warehouse:
