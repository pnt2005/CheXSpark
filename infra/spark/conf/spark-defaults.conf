# ─────────────────────────────────────────────────────────────
# CheXSpark: Spark standalone cluster defaults
# Shared by master + workers via /opt/spark/conf volume mount
# ─────────────────────────────────────────────────────────────

spark.master                     spark://spark-master:7077
spark.driver.host                spark-master
spark.ui.showConsoleProgress     true
spark.sql.shuffle.partitions     8
spark.default.parallelism        8

# ── S3 / MinIO access (bronze & silver layers) ──────────────
# Credentials lấy từ env AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (docker-compose inject).
# Dùng EnvironmentVariableCredentialsProvider của AWS SDK để tránh hard-code trong file conf.
spark.hadoop.fs.s3a.endpoint                  http://minio:9000
spark.hadoop.fs.s3a.path.style.access         true
spark.hadoop.fs.s3a.connection.ssl.enabled    false
spark.hadoop.fs.s3a.aws.credentials.provider  com.amazonaws.auth.EnvironmentVariableCredentialsProvider
spark.hadoop.fs.s3a.change.detection.mode     none

# ── Serialization (required by PySpark + MLlib) ─────────────
spark.serializer                 org.apache.spark.serializer.KryoSerializer

# ── MLflow (experiment tracking for Deep Learning + MLlib) ──
spark.mlflow.tracking.uri        http://mlflow:5000
