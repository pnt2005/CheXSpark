name: Train on Kaggle (GPU)

# Bấm "Run workflow" trên GitHub → đẩy notebook lên Kaggle, chờ train trên GPU,
# tải checkpoint + metrics về làm artifact. Không cần máy local có GPU.
#
# Cần 2 repository secrets (Settings → Secrets and variables → Actions):
#   KAGGLE_USERNAME   username Kaggle (chữ thường, trong URL profile)
#   KAGGLE_KEY        API key lấy ở kaggle.com/settings/api → Create New Token
#
# Lưu ý: tài khoản phải đã xác thực số điện thoại mới dùng được GPU.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Stage cần train (1 = U-Net segmentation, 2 = DenseNet121 classification)"
        type: choice
        options: ["1", "2"]
        default: "1"
      epochs:
        description: "Số epoch (để trống = dùng mặc định của notebook)"
        type: string
        required: false
      resume_from:
        description: "Kernel chạy trước để resume (vd <user>/chexspark-stage2-densenet121), để trống = train từ đầu"
        type: string
        required: false
      # Không có input upload_dataset/upload_masks: CSV (35.8MB) và mask pack nằm ở
      # data/ (gitignored), nên bước đẩy dataset phải chạy ở máy local trước.

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài Kaggle CLI
        run: pip install --quiet "kaggle>=1.6.17"

      - name: Nạp credential
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          printf '{"username":"%s","key":"%s"}' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Kiểm tra credential
        run: python scripts/kaggle/train_on_kaggle.py --stage ${{ inputs.stage }} --check

      - name: Train trên Kaggle
        env:
          EPOCHS: ${{ inputs.epochs }}
          RESUME_FROM: ${{ inputs.resume_from }}
        run: |
          ARGS="--stage ${{ inputs.stage }} --poll 60 --wait-timeout 13800 --install"
          if [ -n "$EPOCHS" ]; then ARGS="$ARGS --epochs $EPOCHS"; fi
          if [ -n "$RESUME_FROM" ]; then ARGS="$ARGS --resume-from $RESUME_FROM"; fi
          python scripts/kaggle/train_on_kaggle.py $ARGS

      - name: Upload checkpoint + metrics
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-stage${{ inputs.stage }}-output
          path: |
            notebooks/kaggle/*.pth
            notebooks/kaggle/stage*_metrics.json
          if-no-files-found: warn
          retention-days: 14
